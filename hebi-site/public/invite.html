<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hebi — Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --red:#e11d48; --bg:#0b0b0b; }
    html,body { height:100%; }
    body {
      margin:0; display:flex; align-items:center; justify-content:center;
      background:#0b0b0b; color:#fff; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji';
    }
    .card {
      width: min(92vw, 420px); padding:28px 24px; background:#101010; border-radius:14px;
      box-shadow: 0 0 24px rgba(225, 29, 72, 0.25);
    }
    h1 { margin:0 0 10px; color:var(--red); }
    p { margin:0 0 16px; color:#ddd; }
    input {
      width:100%; padding:12px 14px; border-radius:10px; border:1px solid #2b2b2b; background:#0f0f0f; color:#fff;
      outline:none;
    }
    button {
      margin-top:12px; width:100%; padding:12px 14px; border:none; border-radius:10px; background:var(--red); color:#fff; font-weight:600; cursor:pointer;
    }
    small { color:#aaa; display:block; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter invitation code</h1>
    <p>This route requires a valid Hebi invitation key.</p>
    <input id="key" placeholder="paste your key…" />
    <button onclick="save()">Continue</button>
    <small>Sharing keys will result in an immediate ban.</small>
  </div>

  <script>
    function save() {
      const key = document.getElementById('key').value.trim();
      if (!key) return alert('Please enter your key');
      // on conserve la route originale et on ajoute ?key=
      const url = new URL(window.location.href);
      url.searchParams.set('key', key);
      window.location.replace(url.toString());
    }
  </script>
</body>
</html>
